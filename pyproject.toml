[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "promptshield"
version = "1.0.1"
description = "Zero-Trust Prompt Shield: inspect, redact, guard and improve what goes into and comes out of LLMs."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "abulslab" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "pyyaml>=6",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.6", "mypy>=1.11", "types-PyYAML"]

[project.scripts]
promptshield = "promptshield.cli:main"

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.setuptools.package-data]
promptshield = ["policy/packs/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend/src"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["backend/src", "backend/tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF012", "E501", "E731"]  # long literals (regexes, messages) read better unwrapped

[tool.mypy]
python_version = "3.11"
packages = ["promptshield"]
mypy_path = "backend/src"
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = true
