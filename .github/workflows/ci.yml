name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check backend && ruff format --check backend
      - name: Type check
        run: mypy
      - name: Tests
        run: pytest
      - name: Detection benchmark (fails on any missed sample)
        run: promptshield benchmark > benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark
          path: benchmark.json

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build

  self-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The detectors' own fixtures and UI samples are deliberately unsafe, so the self-scan covers the prose only.
      - uses: ./
        with:
          paths: docs README.md
          fail-on: block

  docker:
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
